<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Confirmer la fermeture d'onglet</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
        color: #1f1f1f;
        background: #fff;
      }
      label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      input {
        width: 16px;
        height: 16px;
        margin: 0;
      }
      p {
        margin: 10px 0 0;
        color: #5f6368;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8eaed;
          background: #292a2d;
        }
        p {
          color: #9aa0a6;
        }
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="enabled" />
      Proposer de rouvrir
    </label>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
