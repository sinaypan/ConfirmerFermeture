<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fermer cet onglet ?</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        padding: 20px 22px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
        color: #1f1f1f;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 600;
      }
      .tab {
        min-width: 0;
      }
      .tab div {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #title {
        font-weight: 600;
      }
      #host {
        color: #5f6368;
      }
      .buttons {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      button {
        padding: 8px 18px;
        font: inherit;
        font-weight: 600;
        border-radius: 18px;
        border: 1px solid #c4c7c5;
        color: #0b57d0;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        border-color: #0b57d0;
        color: #fff;
        background: #0b57d0;
      }
      button:focus-visible {
        outline: 2px solid #0b57d0;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8eaed;
          background: #292a2d;
        }
        #host {
          color: #9aa0a6;
        }
        button {
          border-color: #5f6368;
          color: #a8c7fa;
          background: #292a2d;
        }
        button.primary {
          border-color: #a8c7fa;
          color: #062e6f;
          background: #a8c7fa;
        }
        button:focus-visible {
          outline-color: #a8c7fa;
        }
      }
    </style>
  </head>
  <body>
    <h1>Fermer cet onglet ?</h1>
    <div class="tab">
      <div id="title"></div>
      <div id="host"></div>
    </div>
    <div class="buttons">
      <button id="close">Fermer</button>
      <button id="keep" class="primary" autofocus>Garder l'onglet</button>
    </div>
    <script src="confirm.js"></script>
  </body>
</html>
